<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postcard from Napoli — paulandvideo</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            itc: ["ITC", "system-ui", "sans-serif"],
            times: ["Times New Roman", "Times", "Baskerville", "Georgia", "serif"],
          },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-[#050505] text-[#f5f5f5] font-itc selection:bg-white selection:text-black">

  <div id="emoji-cursor"></div>

  <!-- ───────── Header Minimal ───────── -->
  <header class="fixed inset-x-0 top-0 z-50 flex h-20 items-center justify-between px-6 md:px-14 bg-gradient-to-b from-black/90 via-black/50 to-transparent transition-all duration-300">
    <a href="../index.html" class="group flex items-center gap-2">
      <span class="font-itc text-lg md:text-xl font-bold tracking-tight text-white group-hover:opacity-80 transition-opacity">
        pauland<span class="text-[#e50914]">video</span>
      </span>
    </a>

    <nav class="flex items-center gap-8 md:gap-12 text-[11px] md:text-xs uppercase tracking-[0.25em] text-white/70 font-itc">
      <a href="../index.html#works" class="hover:text-white transition-colors">Lavori</a>
      <a href="#contact" class="hover:text-white transition-colors">Contatti</a>
    </nav>
  </header>

  <!-- ───────── Sezione Contenuto Progetto (Video Grande & Chiaro + Galleria) ───────── -->
  <section class="pt-24 md:pt-32 pb-16 px-4 md:px-8 max-w-6xl mx-auto flex flex-col items-center">
    
    <!-- Player Video Custom Sleek Grande & Chiaro -->
    <div class="custom-video-player group relative mb-12 w-full max-w-4xl lg:max-w-5xl aspect-video overflow-hidden rounded-xl md:rounded-2xl border border-white/20 hover:border-white/35 bg-[#0a0a0a] shadow-[0_20px_60px_rgba(0,0,0,0.95)] ring-1 ring-white/10 select-none">
      <video
        src="../media/VideoPizzeriaOrizzontale.mp4"
        poster="../media/pizzeria/Foto1.jpg"
        playsinline
        muted
        loop
        preload="metadata"
        class="h-full w-full object-cover cursor-pointer"
      ></video>

      <!-- Pulsante Play Centrale Grande e Chiaro -->
      <button class="btn-center-play absolute inset-0 z-20 m-auto flex h-20 w-20 md:h-24 md:w-24 items-center justify-center rounded-full bg-black/70 backdrop-blur-md border-2 border-white/40 text-white shadow-[0_0_40px_rgba(0,0,0,0.85)] transition-all duration-300 hover:scale-110 hover:bg-black/85 hover:border-white active:scale-95" aria-label="Riproduci">
        <svg class="w-8 h-8 md:w-10 md:h-10 translate-x-0.5 fill-white" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" /></svg>
      </button>

      <!-- Barra di Controllo Personalizzata in Basso -->
      <div class="player-controls-bar absolute inset-x-0 bottom-0 z-20 flex flex-col justify-end bg-gradient-to-t from-black/95 via-black/60 to-transparent pt-14 pb-3.5 px-4 md:px-6 transition-opacity duration-300 font-itc opacity-0">
        <!-- Barra di Avanzamento / Scrubber -->
        <div class="progress-track group/track relative flex h-4 w-full cursor-pointer items-center">
          <div class="h-1.5 md:h-2 w-full rounded-full bg-white/25 transition-all group-hover/track:h-2.5">
            <div class="progress-fill relative h-full w-0 rounded-full bg-[#e50914] transition-all">
              <div class="absolute right-0 top-1/2 h-3.5 w-3.5 -translate-y-1/2 translate-x-1/2 rounded-full bg-white shadow-lg opacity-0 group-hover/track:opacity-100 transition-opacity"></div>
            </div>
          </div>
        </div>

        <!-- Pulsanti & Timestamp -->
        <div class="mt-2 flex items-center justify-between text-white">
          <div class="flex items-center gap-3">
            <button class="btn-play-pause text-white/90 hover:text-white transition-colors p-1" aria-label="Play/Pausa">
              <svg class="icon-play w-5 h-5 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" /></svg>
              <svg class="icon-pause w-5 h-5 fill-current hidden" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>
            </button>
            <span class="time-display text-xs md:text-sm tracking-wider text-white/90 font-mono">0:00 / 0:00</span>
          </div>

          <div class="flex items-center gap-3.5">
            <button class="btn-mute text-white/90 hover:text-white transition-colors p-1" aria-label="Audio">
              <svg class="icon-sound-off w-5 h-5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none" /><line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" /></svg>
              <svg class="icon-sound-on w-5 h-5 stroke-current fill-none stroke-2 hidden" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" /></svg>
            </button>
            <button class="btn-fullscreen text-white/90 hover:text-white transition-colors p-1" aria-label="Schermo intero">
              <svg class="w-5 h-5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" /></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Galleria Fotografica Più Grande & Uniforme (2 Colonne, Aspect 4/3) -->
    <div class="w-full max-w-3xl grid grid-cols-2 gap-3.5 md:gap-5">
      <div class="relative aspect-[4/3] w-full overflow-hidden rounded-md bg-[#111111] border border-white/10 shadow-md group">
        <img src="../media/pizzeria/Foto1.jpg" alt="" class="h-full w-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out" />
      </div>
      <div class="relative aspect-[4/3] w-full overflow-hidden rounded-md bg-[#111111] border border-white/10 shadow-md group">
        <img src="../media/pizzeria/Foto2.jpg" alt="" class="h-full w-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out" />
      </div>
      <div class="relative aspect-[4/3] w-full overflow-hidden rounded-md bg-[#111111] border border-white/10 shadow-md group">
        <img src="../media/pizzeria/Foto3.jpg" alt="" class="h-full w-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out" />
      </div>
      <div class="relative aspect-[4/3] w-full overflow-hidden rounded-md bg-[#111111] border border-white/10 shadow-md group">
        <img src="../media/pizzeria/Foto4.jpg" alt="" class="h-full w-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out" />
      </div>
    </div>
  </section>

  <!-- ───────── Altri Lavori (Margini Allineati) ───────── -->
  <section id="works" class="w-full pt-16 pb-28 border-t border-white/10 scroll-mt-20">
    <div class="mx-auto max-w-7xl px-6 md:px-14">
      <div class="mb-10 flex items-end justify-between border-b border-white/10 pb-6">
        <div>
          <span class="text-[10px] uppercase tracking-[0.3em] text-white/40 font-itc">Progetti Selezionati</span>
          <h2 class="font-itc text-4xl sm:text-5xl md:text-6xl text-white font-bold tracking-tight mt-1">Altri Lavori</h2>
        </div>
        <span class="hidden sm:block text-xs uppercase tracking-[0.25em] text-white/40 font-itc">01 — 01</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
        <a
          href="pitittos.html"
          data-emoji="🥐"
          class="has-emoji-cursor group relative block w-full overflow-hidden rounded-md bg-[#0d0d0d] aspect-[16/10] border border-white/10 hover:border-white/30 transition-all duration-500"
        >
          <img src="../media/cannoli/Foto3.jpg" alt="Pitittos" class="h-full w-full object-cover transition-all duration-700 ease-out group-hover:scale-105" />
          <video src="../media/cannoli/VideoVerticale1.mp4" muted loop playsinline preload="metadata" class="absolute inset-0 h-full w-full object-cover opacity-0 transition-opacity duration-300 group-hover:opacity-100 pointer-events-none"></video>
          <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-black/10 transition-opacity duration-300 group-hover:from-black/90 group-hover:via-black/30"></div>
          <div class="absolute inset-x-0 bottom-0 z-20 p-6 md:p-8 flex flex-col justify-end transition-transform duration-300">
            <h3 class="font-itc text-2xl sm:text-3xl lg:text-4xl font-bold tracking-tight text-white drop-shadow-md group-hover:translate-x-1 transition-transform duration-300 leading-tight">Pitittos</h3>
          </div>
        </a>
      </div>
    </div>
  </section>

  <!-- ───────── Footer Minimal ───────── -->
  <footer id="contact" class="w-full bg-black py-12 border-t border-white/10 font-itc">
    <div class="mx-auto max-w-7xl px-6 md:px-14 flex flex-col sm:flex-row items-center justify-between gap-6 text-sm md:text-[15px] text-white">
      <div><a href="mailto:marchesellipaolo9@gmail.com" class="underline underline-offset-4 hover:opacity-75 transition-opacity">marchesellipaolo9@gmail.com</a></div>
      <div class="flex flex-wrap items-center justify-center sm:justify-end gap-x-5 gap-y-2">
        <div class="flex items-center gap-2.5 text-sm md:text-[15px]">
          <a
            href="https://www.instagram.com/maarcpaolo"
            target="_blank"
            rel="noopener noreferrer"
            class="hover:underline underline-offset-4 transition-all"
          >
            Paolo Marcheselli
          </a>
          <span class="text-white/40">·</span>
          <a
            href="https://www.instagram.com/maarcpaolo"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
            class="text-white hover:opacity-75 transition-opacity inline-flex items-center"
          >
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </footer>

  <script src="../js/player.js"></script>
</body>
</html>
